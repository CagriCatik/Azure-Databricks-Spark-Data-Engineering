[project]
site_name = "Azure Databricks for Data Engineers"
site_description = "Course documentation: building data engineering solutions on Azure Databricks with Apache Spark, Delta Lake, Unity Catalog, and Lakeflow Jobs."
site_author = "mccatik"

# The canonical URL for the site. Update <user> and <repo> to match your
# GitHub Pages URL, e.g. https://mccatik.github.io/Azure-Databricks-Spark-Data-Engineering/
# site_url = "https://<user>.github.io/<repo>/"

docs_dir = "docs"
site_dir = "site"

copyright = """
Copyright &copy; 2026 - Azure Databricks for Data Engineers
"""

